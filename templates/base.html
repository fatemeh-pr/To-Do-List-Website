<!DOCTYPE html>
<!--
    Base layout and styles: AI-generated, customized for this project.
    Flask/Jinja integration and all form markup: written by me.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}To-Do List{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
        }

        /* Navbar */

        .navbar {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
        }

        .navbar-brand,
        .navbar .nav-link {
            color: white;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .navbar .nav-link:hover {
            color: #ddd;
        }


        /* Forms */

        .form-container {
            min-height: calc(100vh - 56px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            width: 100%;
            max-width: 400px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .form-box h3 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-box .submit-button {
            width: 100%;
        }


        /* To-Do List */

        .todo-container {
            min-height: calc(100vh - 56px);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .todo-box {
            width: 100%;
            max-width: 600px;

            padding: 30px;

            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 15px;
            margin-bottom: 10px;

            background: rgba(255, 255, 255, 0.7);

            border-radius: 8px;
        }

        .task-name {
            margin: 0;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-buttons {
            display: flex;
            gap: 5px;
        }
    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="{{ url_for('home') }}">
                To-Do List
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="{{ url_for('home') }}">
                    Home
                </a>

                {% if current_user.is_authenticated %}

                    <a class="nav-link" href="{{ url_for('logout') }}">
                        Logout
                    </a>

                {% else %}

                    <a class="nav-link" href="{{ url_for('login') }}">
                        Login
                    </a>

                    <a class="nav-link" href="{{ url_for('register') }}">
                        Sign Up
                    </a>

                {% endif %}

            </div>

        </div>
    </nav>


    {% block content %}
    {% endblock %}

</body>
</html>
